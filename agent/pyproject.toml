[project]
name = "heard-linh-agent"
version = "0.1.0"
description = "Linh: the real-time voice + avatar assistant for Heard (LiveKit Agents + Tavus)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "livekit-agents[openai,tavus]~=1.8",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "aws-bedrock-token-generator>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
